spring.application.name=money
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.servlet.context-path=/api/v1.0

#JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Email Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_EMAIL}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${FROM_EMAIL}

#environment propertities
spring.config.import=optional:file:.env[.properties]

#JWT creation
jwt.secret=${SECRET_KEY}
jwt.expiration=86400000 

money.manager.frontend.url=${FRONTEND_URL}

app.activation.url=${MONEY_MANAGER_BACKEND_URL}

spring.profiles.active=prod